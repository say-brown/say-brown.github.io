<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aim Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas {
            flex: 1;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            touch-action: none;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            pointer-events: none;
        }

        .stat {
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        #feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 20px;
            z-index: 10;
        }

        #startScreen h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #startScreen p {
            font-size: 16px;
            text-align: center;
            padding: 0 20px;
            opacity: 0.8;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .stats-panel {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .stats-panel div {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div id="hud">
            <div class="stat">Score: <span id="score">0</span></div>
            <div class="stat">Avg Error: <span id="avgError">--</span>°</div>
            <div class="stat">Streak: <span id="streak">0</span></div>
        </div>

        <div id="feedback"></div>

        <div id="startScreen">
            <h1>🎯 Aim Trainer</h1>
            <p>Draw your aim vector toward the target using the virtual joystick</p>
            <div class="stats-panel">
                <div>Best Score: <span id="bestScore">0</span></div>
                <div>Total Shots: <span id="totalShots">0</span></div>
                <div>Best Accuracy: <span id="bestAccuracy">--</span>°</div>
            </div>
            <button id="startBtn">Start Training</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const feedbackEl = document.getElementById('feedback');

        let width, height;
        let gameActive = false;
        let player = { x: 0, y: 0 };
        let target = { x: 0, y: 0 };
        let joystick = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 };
        let score = 0;
        let streak = 0;
        let shotsTaken = 0;
        let errorHistory = [];
        let playerAimAngle = null;
        let targetAngle = null;
        let showVectors = false;
        let vectorTimer = 0;
        let targetSpawnTime = 0;

        // Load saved stats
        let bestScore = parseInt(localStorage.getItem('bestScore') || '0');
        let totalShots = parseInt(localStorage.getItem('totalShots') || '0');
        let bestAccuracy = parseFloat(localStorage.getItem('bestAccuracy') || '999');

        document.getElementById('bestScore').textContent = bestScore;
        document.getElementById('totalShots').textContent = totalShots;
        document.getElementById('bestAccuracy').textContent = bestAccuracy === 999 ? '--' : bestAccuracy.toFixed(1);

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            player.x = width / 2;
            player.y = height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function repositionPlayer() {
            // Reposition player to random location (with margins)
            const margin = 100;
            player.x = margin + Math.random() * (width - margin * 2);
            player.y = margin + Math.random() * (height - margin * 2);
        }

        function spawnTarget() {
            const minDist = 100;
            const maxDist = Math.min(width, height) * 0.4;
            const angle = Math.random() * Math.PI * 2;
            const dist = minDist + Math.random() * (maxDist - minDist);
            
            target.x = player.x + Math.cos(angle) * dist;
            target.y = player.y + Math.sin(angle) * dist;
            
            // Keep target on screen
            target.x = Math.max(50, Math.min(width - 50, target.x));
            target.y = Math.max(50, Math.min(height - 50, target.y));
            
            targetSpawnTime = performance.now();
        }

        function calculateAngleDifference(angle1, angle2) {
            let diff = Math.abs(angle1 - angle2);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            return diff * (180 / Math.PI);
        }

        function evaluateShot() {
            if (playerAimAngle === null) return;

            const dx = target.x - player.x;
            const dy = target.y - player.y;
            targetAngle = Math.atan2(dy, dx);

            const angleDiff = calculateAngleDifference(playerAimAngle, targetAngle);
            const reactionTime = (performance.now() - targetSpawnTime) / 1000;

            errorHistory.push(angleDiff);
            if (errorHistory.length > 50) errorHistory.shift();

            shotsTaken++;
            totalShots++;
            localStorage.setItem('totalShots', totalShots);
            document.getElementById('totalShots').textContent = totalShots;

            // Scoring
            let points = 0;
            let feedback = '';
            let color = '';

            if (angleDiff <= 2) {
                points = 100;
                feedback = 'PERFECT!';
                color = '#00ff88';
                streak++;
            } else if (angleDiff <= 5) {
                points = 75;
                feedback = 'GREAT!';
                color = '#00ddff';
                streak++;
            } else if (angleDiff <= 10) {
                points = 50;
                feedback = 'GOOD';
                color = '#ffaa00';
                streak++;
            } else if (angleDiff <= 20) {
                points = 25;
                feedback = 'OK';
                color = '#ff6600';
                streak = 0;
            } else {
                points = 0;
                feedback = 'MISS';
                color = '#ff3333';
                streak = 0;
            }

            // Time bonus
            if (reactionTime < 0.5) points += 20;
            else if (reactionTime < 1.0) points += 10;

            // Streak multiplier
            if (streak > 5) points = Math.floor(points * 1.5);
            else if (streak > 10) points = Math.floor(points * 2);

            score += points;

            // Update best score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
            }

            // Update best accuracy
            if (angleDiff < bestAccuracy) {
                bestAccuracy = angleDiff;
                localStorage.setItem('bestAccuracy', bestAccuracy.toFixed(1));
            }

            // Show feedback
            feedbackEl.textContent = `${feedback}\n${angleDiff.toFixed(1)}°`;
            feedbackEl.style.color = color;
            feedbackEl.style.opacity = '1';
            setTimeout(() => feedbackEl.style.opacity = '0', 1000);

            // Show vectors
            showVectors = true;
            vectorTimer = performance.now();

            // Update HUD
            updateHUD();

            // Spawn new target after delay
            setTimeout(() => {
                showVectors = false;
                playerAimAngle = null;
                targetAngle = null;
                
                // Only reposition and spawn new target if shot was good or better
                if (angleDiff <= 10) {
                    repositionPlayer();
                    spawnTarget();
                }
                // Otherwise keep same target - player must retry
            }, 600);
        }

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            
            if (errorHistory.length > 0) {
                const avgError = errorHistory.reduce((a, b) => a + b, 0) / errorHistory.length;
                document.getElementById('avgError').textContent = avgError.toFixed(1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw player
            ctx.beginPath();
            ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw target
            if (!showVectors) {
                ctx.beginPath();
                ctx.arc(target.x, target.y, 20, 0, Math.PI * 2);
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Pulsing effect
                const pulse = Math.sin(Date.now() * 0.005) * 5;
                ctx.beginPath();
                ctx.arc(target.x, target.y, 20 + pulse, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(233, 69, 96, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw joystick
            if (joystick.active) {
                // Joystick base
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 60, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Joystick direction line
                ctx.beginPath();
                ctx.moveTo(joystick.startX, joystick.startY);
                ctx.lineTo(joystick.currentX, joystick.currentY);
                ctx.strokeStyle = '#00ddff';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Joystick knob
                ctx.beginPath();
                ctx.arc(joystick.currentX, joystick.currentY, 25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 221, 255, 0.5)';
                ctx.fill();
                ctx.strokeStyle = '#00ddff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw vectors after shot
            if (showVectors && playerAimAngle !== null && targetAngle !== null) {
                const vectorLength = 150;

                // True target vector (red)
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(
                    player.x + Math.cos(targetAngle) * vectorLength,
                    player.y + Math.sin(targetAngle) * vectorLength
                );
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Player aim vector (green)
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(
                    player.x + Math.cos(playerAimAngle) * vectorLength,
                    player.y + Math.sin(playerAimAngle) * vectorLength
                );
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            if (gameActive) {
                requestAnimationFrame(draw);
            }
        }

        // Touch controls
        canvas.addEventListener('pointerdown', (e) => {
            if (!gameActive || showVectors) return;

            joystick.active = true;
            joystick.startX = e.clientX;
            joystick.startY = e.clientY;
            joystick.currentX = e.clientX;
            joystick.currentY = e.clientY;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!joystick.active) return;

            const dx = e.clientX - joystick.startX;
            const dy = e.clientY - joystick.startY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 60;

            if (dist > maxDist) {
                const angle = Math.atan2(dy, dx);
                joystick.currentX = joystick.startX + Math.cos(angle) * maxDist;
                joystick.currentY = joystick.startY + Math.sin(angle) * maxDist;
            } else {
                joystick.currentX = e.clientX;
                joystick.currentY = e.clientY;
            }
        });

        canvas.addEventListener('pointerup', (e) => {
            if (!joystick.active) return;

            const dx = joystick.currentX - joystick.startX;
            const dy = joystick.currentY - joystick.startY;
            playerAimAngle = Math.atan2(dy, dx);

            joystick.active = false;
            evaluateShot();
        });

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameActive = true;
            score = 0;
            streak = 0;
            shotsTaken = 0;
            errorHistory = [];
            updateHUD();
            repositionPlayer();
            spawnTarget();
            draw();
        });
    </script>
</body>
</html>
