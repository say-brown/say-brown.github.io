<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>VR Shadertoy Sphere</title>

  <!--
    ================================================================
    EDIT THIS SHADER.
    It uses Shadertoy-style mainImage / iTime / iResolution.
    The shader is simply wrapped onto the inside of a sphere.
    No raycasting or raymarching is used.
    ================================================================
  -->
  <script id="shadertoy-code" type="x-shader/x-fragment">
float plasma(vec2 position, float time) {
    float value =
        sin(position.x + time) +
        sin(position.y + time) +
        sin(position.x + position.y + time);

    return (value + 3.0) / 6.0;
}

vec3 palette(float value) {
    return 0.5 + 0.5 * cos(
        6.28318 * (value + vec3(0.3, 0.0, 0.7))
    );
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
    vec2 uv = fragCoord / iResolution.xy;

    // center the coords and fix aspect ratio
    vec2 p = uv * 2.0 - 1.0;
    p.x *= iResolution.x / iResolution.y;

    // scale up coordinate space so the waves are visible
    p *= 10.0;

    float v = plasma(p, iTime);
    vec3 col = palette(v);

    fragColor = vec4(col, 1.0);
}
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #info {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      max-width: min(540px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(8px);
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
    }

    #info strong {
      display: block;
      margin-bottom: 3px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="info">
    <strong>VR Shadertoy Sphere</strong>
    Your 2D shader is wrapped around the inside of a sphere.
    Drag on desktop to look around, or use Enter VR in Quest Browser.
  </div>

  <script type="module">
    import * as THREE from "three";
    import { VRButton } from "three/addons/webxr/VRButton.js";

    const SHADER_WIDTH = 1280;
    const SHADER_HEIGHT = 720;

    const userShader = document
      .getElementById("shadertoy-code")
      .textContent
      .trim();

    const vertexShader = `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      uniform vec3 iResolution;
      uniform float iTime;

      varying vec2 vUv;

      ${userShader}

      void main() {
        vec2 fragCoord = vUv * iResolution.xy;

        vec4 color = vec4(0.0);
        mainImage(color, fragCoord);

        gl_FragColor = color;
      }
    `;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.01,
      200
    );

    // Approximate standing eye height for desktop preview.
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const uniforms = {
      iResolution: {
        value: new THREE.Vector3(SHADER_WIDTH, SHADER_HEIGHT, 1)
      },
      iTime: {
        value: 0
      }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader,
      fragmentShader,

      // Render the sphere's inner surface.
      side: THREE.BackSide
    });

    // Large enough that small physical headset movement still keeps you
    // comfortably inside the sphere.
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(30, 96, 64),
      material
    );

    // Center the sphere around standing eye height.
    sphere.position.set(0, 1.6, 0);
    scene.add(sphere);

    // Desktop mouse/touch look. This only rotates the Three.js camera.
    // The rotation is not passed into the shader.
    let yaw = 0;
    let pitch = 0;
    let dragging = false;
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragging || renderer.xr.isPresenting) return;

      const dx = event.clientX - previousX;
      const dy = event.clientY - previousY;

      previousX = event.clientX;
      previousY = event.clientY;

      yaw -= dx * 0.004;
      pitch -= dy * 0.004;
      pitch = Math.max(
        -Math.PI / 2 + 0.01,
        Math.min(Math.PI / 2 - 0.01, pitch)
      );

      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      dragging = false;
      renderer.domElement.releasePointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragging = false;
    });

    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      uniforms.iTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
